<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Transferência de Estoque</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; color: #1a1a1a; }
  .header { background: #1a56a0; color: white; padding: 16px 20px; }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header p { font-size: 12px; opacity: 0.8; margin-top: 2px; }
  .container { padding: 16px; max-width: 500px; margin: 0 auto; }
  .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .card-title { font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; margin-top: 12px; }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=number] {
    width: 100%; height: 46px; padding: 0 12px;
    border: 1.5px solid #e0e0e0; border-radius: 8px;
    font-size: 14px; font-weight: 600; color: #1a1a1a; background: #fafafa;
    text-transform: uppercase; -webkit-appearance: none;
  }
  input:focus { outline: none; border-color: #1a56a0; background: #fff; }
  input::placeholder { font-weight: 400; color: #bbb; }
  .tabs { display: flex; background: #f0f2f5; border-radius: 10px; padding: 4px; margin-bottom: 14px; gap: 4px; }
  .tab-btn { flex: 1; padding: 10px 4px; border: none; border-radius: 8px; background: transparent; font-size: 11px; font-weight: 700; color: #888; cursor: pointer; text-transform: uppercase; letter-spacing: 0.3px; -webkit-tap-highlight-color: transparent; }
  .tab-ativo-compra     { background: #cfe2ff; color: #0a2e6e; }
  .tab-ativo-emprestimo { background: #fff3cd; color: #6b4400; }
  .tab-ativo-devolucao  { background: #d4edda; color: #155724; }
  .op-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .op-btn { padding: 14px 8px; border: 2px solid #e0e0e0; border-radius: 10px; background: white; cursor: pointer; text-align: center; -webkit-tap-highlight-color: transparent; }
  .op-btn .quem { font-size: 17px; font-weight: 800; display: block; }
  .op-btn .acao { font-size: 10px; font-weight: 600; text-transform: uppercase; display: block; margin: 4px 0; color: #888; }
  .op-btn .para { font-size: 14px; font-weight: 700; display: block; }
  .op-ativo-compra     { background: #cfe2ff; border-color: #1a56a0; }
  .op-ativo-compra .quem { color: #0a2e6e; } .op-ativo-compra .acao { color: #1a56a0; } .op-ativo-compra .para { color: #1a56a0; }
  .op-ativo-emprestimo { background: #fff3cd; border-color: #d4a000; }
  .op-ativo-emprestimo .quem { color: #6b4400; } .op-ativo-emprestimo .acao { color: #d4a000; } .op-ativo-emprestimo .para { color: #a06000; }
  .op-ativo-devolucao  { background: #d4edda; border-color: #28a745; }
  .op-ativo-devolucao .quem { color: #155724; } .op-ativo-devolucao .acao { color: #28a745; } .op-ativo-devolucao .para { color: #1e7e34; }
  .sku-wrap { position: relative; }
  .sku-dropdown { display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 50; background: white; border: 1.5px solid #ddd; border-radius: 8px; max-height: 220px; overflow-y: auto; box-shadow: 0 4px 16px rgba(0,0,0,0.12); margin-top: 2px; }
  .sku-item { padding: 12px 14px; font-size: 13px; font-weight: 600; cursor: pointer; border-bottom: 1px solid #f0f0f0; text-transform: uppercase; }
  .sku-item:last-child { border: none; }
  .sku-item:active { background: #f0f4ff; }
  .sku-item.new-sku { color: #1a56a0; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-submit { width: 100%; height: 52px; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 14px; text-transform: uppercase; letter-spacing: 1px; -webkit-tap-highlight-color: transparent; }
  .btn-compra     { background: #1a56a0; } .btn-compra:active     { background: #0e3a73; }
  .btn-emprestimo { background: #d4a000; } .btn-emprestimo:active { background: #a07800; }
  .btn-devolucao  { background: #28a745; } .btn-devolucao:active  { background: #1e7e34; }
  .btn-submit:disabled { background: #bbb !important; }
  .success-box { display: none; border-radius: 10px; padding: 16px; text-align: center; margin-top: 12px; }
  .suc-compra     { background: #cfe2ff; border: 2px solid #1a56a0; }
  .suc-compra p   { color: #0a2e6e; font-size: 14px; font-weight: 800; text-transform: uppercase; }
  .suc-compra span { color: #1a56a0; font-size: 12px; display: block; margin-top: 4px; font-weight: 600; }
  .suc-emprestimo { background: #fff3cd; border: 2px solid #d4a000; }
  .suc-emprestimo p { color: #6b4400; font-size: 14px; font-weight: 800; text-transform: uppercase; }
  .suc-emprestimo span { color: #a06000; font-size: 12px; display: block; margin-top: 4px; font-weight: 600; }
  .suc-devolucao  { background: #d4edda; border: 2px solid #28a745; }
  .suc-devolucao p { color: #155724; font-size: 14px; font-weight: 800; text-transform: uppercase; }
  .suc-devolucao span { color: #1e7e34; font-size: 12px; display: block; margin-top: 4px; font-weight: 600; }
  .error-box { display: none; background: #fdecea; border: 2px solid #c62828; border-radius: 10px; padding: 12px; margin-top: 10px; font-size: 13px; font-weight: 700; color: #b71c1c; text-transform: uppercase; }

  /* MODAL DE AVISO */
  .overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.55); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
  .overlay.show { display: flex; }
  .modal { background: white; border-radius: 16px; padding: 24px; max-width: 380px; width: 100%; text-align: center; }
  .modal-icon { font-size: 40px; margin-bottom: 12px; }
  .modal-title { font-size: 16px; font-weight: 800; color: #b71c1c; text-transform: uppercase; margin-bottom: 8px; }
  .modal-msg { font-size: 13px; color: #555; font-weight: 600; line-height: 1.6; margin-bottom: 20px; }
  .modal-msg strong { color: #1a1a1a; }
  .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-btn { height: 46px; border: none; border-radius: 10px; font-size: 13px; font-weight: 800; cursor: pointer; text-transform: uppercase; -webkit-tap-highlight-color: transparent; }
  .modal-cancelar { background: #f0f0f0; color: #555; }
  .modal-cancelar:active { background: #ddd; }
  .modal-continuar { background: #c62828; color: white; }
  .modal-continuar:active { background: #8b0000; }

  .hist-card { display: none; }
  .hist-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .hist-compra     { background: #cfe2ff; color: #0a2e6e; }
  .hist-emprestimo { background: #fff3cd; color: #6b4400; }
  .hist-devolucao  { background: #d4edda; color: #155724; }
  .legenda { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .leg { font-size: 11px; font-weight: 700; text-transform: uppercase; display: flex; align-items: center; gap: 5px; }
  .leg-cor { width: 12px; height: 12px; border-radius: 3px; }
  .footer { text-align: center; font-size: 11px; font-weight: 600; color: #aaa; padding: 20px 0 30px; text-transform: uppercase; letter-spacing: 1px; }
  .hint { font-size: 12px; color: #aaa; text-align: center; margin-top: 10px; font-weight: 600; text-transform: uppercase; }
</style>
</head>

<!-- MODAL DE AVISO DEVOLUÇÃO INDEVIDA -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-icon">⚠️</div>
    <div class="modal-title">ATENÇÃO!</div>
    <div class="modal-msg" id="modalMsg"></div>
    <div class="modal-btns">
      <button class="modal-btn modal-cancelar" onclick="fecharModal()">✕ CANCELAR</button>
      <button class="modal-btn modal-continuar" onclick="confirmarEnvio()">CONTINUAR MESMO ASSIM</button>
    </div>
  </div>
</div>

<div class="header">
  <h1>📦 TRANSFERÊNCIA DE ESTOQUE</h1>
  <p>MD2 ↔ ZENX — COMPRAS, EMPRÉSTIMOS E DEVOLUÇÕES</p>
</div>
<div class="container">

  <div class="legenda">
    <div class="leg"><div class="leg-cor" style="background:#cfe2ff;border:1px solid #1a56a0"></div>COMPRA</div>
    <div class="leg"><div class="leg-cor" style="background:#fff3cd;border:1px solid #d4a000"></div>EMPRÉSTIMO</div>
    <div class="leg"><div class="leg-cor" style="background:#d4edda;border:1px solid #28a745"></div>DEVOLUÇÃO</div>
  </div>

  <div class="card">
    <div class="card-title">Funcionário</div>
    <label>QUEM ESTÁ REGISTRANDO</label>
    <input type="text" id="funcionario" placeholder="SEU NOME" />
    <label>QUEM AUTORIZOU</label>
    <input type="text" id="autorizado" placeholder="NOME DO AUTORIZADOR" />
  </div>

  <div class="card">
    <div class="card-title">Tipo de Movimentação</div>
    <div class="tabs">
      <button class="tab-btn" id="tabCompra"     onclick="setTipo('compra')"    >🔵 COMPRA</button>
      <button class="tab-btn" id="tabEmprestimo" onclick="setTipo('emprestimo')">🟡 EMPRÉSTIMO</button>
      <button class="tab-btn" id="tabDevolucao"  onclick="setTipo('devolucao')" >🟢 DEVOLUÇÃO</button>
    </div>
    <div class="op-grid" id="opGrid"></div>
    <p class="hint" id="opHint">SELECIONE O TIPO ACIMA</p>
  </div>

  <div class="card">
    <div class="card-title">Produto e Quantidade</div>
    <label>SKU DO PRODUTO</label>
    <div class="sku-wrap">
      <input type="text" id="skuInput" placeholder="DIGITE O SKU OU PARTE DO NOME..."
        autocomplete="off" oninput="filterSku()" onfocus="filterSku()" onblur="setTimeout(hideDrop,250)" />
      <div class="sku-dropdown" id="skuDrop"></div>
    </div>
    <div class="row2" style="margin-top:12px">
      <div>
        <label>QUANTIDADE</label>
        <input type="number" id="qtd" min="1" value="1" inputmode="numeric" style="text-transform:none" />
      </div>
      <div>
        <label>OBSERVAÇÃO</label>
        <input type="text" id="obs" placeholder="OPCIONAL" />
      </div>
    </div>
    <button class="btn-submit btn-compra" id="btnEnviar" onclick="enviar()">✓ REGISTRAR</button>
  </div>

  <div class="success-box" id="successBox">
    <p id="successTitle"></p>
    <span id="successDetail"></span>
  </div>
  <div class="error-box" id="errorBox"></div>

  <div class="card hist-card" id="histCard">
    <div class="card-title">Últimos Registros desta Sessão</div>
    <div id="histList"></div>
  </div>

  <div class="footer">MD2 ↔ ZENX · SISTEMA DE ESTOQUE</div>
</div>

  compra: [
    { quem:"MD2",  acao:"COMPROU DA",    para:"ZENX", origem:"ZENX", destino:"MD2"  },
    { quem:"ZENX", acao:"COMPROU DA",    para:"MD2",  origem:"MD2",  destino:"ZENX" }
  ],
  emprestimo: [
    { quem:"MD2",  acao:"PEGOU EMP. DA", para:"ZENX", origem:"ZENX", destino:"MD2"  },
    { quem:"ZENX", acao:"PEGOU EMP. DA", para:"MD2",  origem:"MD2",  destino:"ZENX" }
  ],
  devolucao: [
    { quem:"MD2",  acao:"DEVOLVEU PARA", para:"ZENX", origem:"MD2",  destino:"ZENX" },
    { quem:"ZENX", acao:"DEVOLVEU PARA", para:"MD2",  origem:"ZENX", destino:"MD2"  }
  ]
};
const ICONES = { compra:"🔵", emprestimo:"🟡", devolucao:"🟢" };
const NOMES  = { compra:"COMPRA", emprestimo:"EMPRÉSTIMO", devolucao:"DEVOLUÇÃO" };

let tipoAtual = null;
let opcaoSel  = null;
let hist = [];
let pendingPayload = null; // guarda dados para envio após confirmação no modal

function setTipo(tipo) {
  tipoAtual = tipo;
  opcaoSel  = null;
  document.getElementById("tabCompra").className     = "tab-btn" + (tipo==="compra"     ? " tab-ativo-compra"     : "");
  document.getElementById("tabEmprestimo").className = "tab-btn" + (tipo==="emprestimo" ? " tab-ativo-emprestimo" : "");
  document.getElementById("tabDevolucao").className  = "tab-btn" + (tipo==="devolucao"  ? " tab-ativo-devolucao"  : "");
  document.getElementById("opHint").style.display = "none";
  document.getElementById("opGrid").innerHTML = OPCOES[tipo].map((op, i) =>
    `<button class="op-btn" id="opBtn${i}" onclick="setOpcao(${i})">
      <span class="quem">${op.quem}</span>
      <span class="acao">${op.acao}</span>
      <span class="para">${op.para}</span>
    </button>`
  ).join("");
  document.getElementById("btnEnviar").className = "btn-submit btn-" + tipo;
  document.getElementById("btnEnviar").textContent = "✓ REGISTRAR " + NOMES[tipo];
}

function setOpcao(i) {
  if(!tipoAtual) return;
  opcaoSel = OPCOES[tipoAtual][i];
  document.getElementById("errorBox").style.display = "none";
  [0,1].forEach(j => {
    const btn = document.getElementById("opBtn"+j);
    if(btn) btn.className = "op-btn" + (j===i ? " op-ativo-"+tipoAtual : "");
  });
}

function filterSku() {
  const q = document.getElementById("skuInput").value.trim().toUpperCase();
  const drop = document.getElementById("skuDrop");
  if(!q){ drop.style.display="none"; return; }
  const matches = SKUS.filter(s => s.toUpperCase().includes(q)).slice(0,12);
  const exact = SKUS.some(s => s.toUpperCase()===q);
  let html = matches.map(s =>
    `<div class="sku-item" ontouchstart="" onclick="selectSku(this.dataset.v)" data-v="${s.replace(/"/g,"&quot;")}">${s}</div>`
  ).join("");
  if(!exact && q.length>1){
    const raw = document.getElementById("skuInput").value.trim().toUpperCase();
    html += `<div class="sku-item new-sku" ontouchstart="" onclick="selectSku(this.dataset.v)" data-v="${raw}">+ ADICIONAR NOVO: "${raw}"</div>`;
  }
  drop.innerHTML = html;
  drop.style.display = (matches.length || (!exact && q.length>1)) ? "block" : "none";
}
function selectSku(s){ document.getElementById("skuInput").value=s; document.getElementById("skuDrop").style.display="none"; }
function hideDrop(){ document.getElementById("skuDrop").style.display="none"; }

async function enviar() {
  const func  = document.getElementById("funcionario").value.trim().toUpperCase();
  const autor = document.getElementById("autorizado").value.trim().toUpperCase();
  const sku   = document.getElementById("skuInput").value.trim().toUpperCase();
  const qtd   = parseInt(document.getElementById("qtd").value)||0;
  const obs   = document.getElementById("obs").value.trim().toUpperCase();
  const err   = document.getElementById("errorBox");
  err.style.display = "none";

  if(!func)      { err.textContent="⚠ INFORME O NOME DO FUNCIONÁRIO.";    err.style.display="block"; return; }
  if(!autor)     { err.textContent="⚠ INFORME O NOME DE QUEM AUTORIZOU."; err.style.display="block"; return; }
  if(!tipoAtual) { err.textContent="⚠ SELECIONE O TIPO DE MOVIMENTAÇÃO."; err.style.display="block"; return; }
  if(!opcaoSel)  { err.textContent="⚠ SELECIONE QUAL EMPRESA.";           err.style.display="block"; return; }
  if(!sku)       { err.textContent="⚠ INFORME O SKU DO PRODUTO.";         err.style.display="block"; return; }
  if(qtd<1)      { err.textContent="⚠ QUANTIDADE DEVE SER PELO MENOS 1."; err.style.display="block"; return; }

  const now = new Date();
  const d = now.toLocaleDateString("pt-BR");
  const h = now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});

  const payload = { data:d, hora:h, funcionario:func, autorizado:autor,
    estoque_origem:opcaoSel.origem, estoque_destino:opcaoSel.destino,
    tipo:tipoAtual, sku, quantidade:qtd, observacao:obs };

  // SE FOR DEVOLUÇÃO: consultar saldo primeiro
  if(tipoAtual === "devolucao") {
    const btn = document.getElementById("btnEnviar");
    btn.disabled = true;
    btn.textContent = "⏳ VERIFICANDO...";
    try {
      const consultaUrl = SHEET_URL + "?acao=consultar&devedor=" + encodeURIComponent(opcaoSel.origem)
        + "&credor=" + encodeURIComponent(opcaoSel.destino)
        + "&sku=" + encodeURIComponent(sku);
      const resp = await fetch(consultaUrl);
      const json = await resp.json();
      const saldo = json.saldo || 0;
      btn.disabled = false;
      btn.textContent = "✓ REGISTRAR DEVOLUÇÃO";

      if(saldo <= 0) {
        // Não deve nada — mostrar modal de aviso
        pendingPayload = payload;
        document.getElementById("modalMsg").innerHTML =
          `<strong>${opcaoSel.origem}</strong> NÃO POSSUI EMPRÉSTIMO PENDENTE DE <strong>${opcaoSel.destino}</strong> PARA O SKU:<br><br>` +
          `<strong style="font-size:15px;color:#1a1a1a">${sku}</strong><br><br>` +
          `DESEJA REGISTRAR MESMO ASSIM?`;
        document.getElementById("overlay").classList.add("show");
        return;
      } else if(qtd > saldo) {
        // Está devolvendo mais do que deve — aviso
        pendingPayload = payload;
        document.getElementById("modalMsg").innerHTML =
          `<strong>${opcaoSel.origem}</strong> DEVE <strong>${saldo} UNIDADES</strong> DO SKU:<br><br>` +
          `<strong style="font-size:15px;color:#1a1a1a">${sku}</strong><br><br>` +
          `VOCÊ ESTÁ TENTANDO DEVOLVER <strong>${qtd} UNIDADES</strong>, QUE É MAIS DO QUE O SALDO DEVEDOR.<br><br>DESEJA CONTINUAR MESMO ASSIM?`;
        document.getElementById("overlay").classList.add("show");
        return;
      }
    } catch(e) {
      btn.disabled = false;
      btn.textContent = "✓ REGISTRAR DEVOLUÇÃO";
      // Se falhar a consulta, permite continuar normalmente
    }
  }

  // Envio normal
  enviarParaPlanilha(payload);
}

function fecharModal() {
  document.getElementById("overlay").classList.remove("show");
  pendingPayload = null;
}

function confirmarEnvio() {
  document.getElementById("overlay").classList.remove("show");
  if(pendingPayload) {
    enviarParaPlanilha(pendingPayload);
    pendingPayload = null;
  }
}

function enviarParaPlanilha(payload) {
  const btn = document.getElementById("btnEnviar");
  btn.disabled = true;
  btn.textContent = "⏳ ENVIANDO...";

  const params = new URLSearchParams(payload);
  new Image().src = SHEET_URL + "?" + params.toString();

  hist.unshift({tipo:payload.tipo, quem:opcaoSel.quem, acao:opcaoSel.acao, para:opcaoSel.para, sku:payload.sku, qtd:payload.quantidade});
  if(hist.length>5) hist.pop();

  setTimeout(()=>{
    const sBox = document.getElementById("successBox");
    sBox.className = "success-box suc-" + payload.tipo;
    sBox.style.display = "block";
    document.getElementById("successTitle").textContent = ICONES[payload.tipo] + " " + opcaoSel.quem + " " + opcaoSel.acao + " " + opcaoSel.para;
    document.getElementById("successDetail").textContent = payload.sku + " | " + payload.quantidade + "x | AUTORIZADO: " + payload.autorizado + " | " + payload.data + " " + payload.hora;
    setTimeout(()=> sBox.style.display="none", 6000);
    document.getElementById("skuInput").value = "";
    document.getElementById("qtd").value = "1";
    document.getElementById("obs").value = "";
    btn.disabled = false;
    btn.textContent = "✓ REGISTRAR " + NOMES[payload.tipo];
    renderHist();
  }, 1500);
}

function renderHist() {
  if(!hist.length) return;
  document.getElementById("histCard").style.display = "block";
  document.getElementById("histList").innerHTML = hist.map(h =>
    `<div class="hist-item hist-${h.tipo}">
      <span>${h.quem} ${h.acao} ${h.para} · ${h.sku}</span>
      <span>${h.qtd}x ${ICONES[h.tipo]}</span>
    </div>`
  ).join("");
}
</script>
</body>
</html>
