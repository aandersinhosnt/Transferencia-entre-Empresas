<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Transferência de Estoque</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f4f4; color: #1a1a1a; }

  .header { background: #1a56a0; color: white; padding: 16px 20px; position: sticky; top: 0; z-index: 10; }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header p { font-size: 12px; opacity: 0.8; margin-top: 2px; }

  .container { padding: 16px; max-width: 500px; margin: 0 auto; }

  .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .card-title { font-size: 13px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }

  label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; margin-top: 12px; }
  label:first-child { margin-top: 0; }

  input[type=text], input[type=number] {
    width: 100%; height: 44px; padding: 0 12px;
    border: 1.5px solid #ddd; border-radius: 8px;
    font-size: 15px; color: #1a1a1a; background: #fff;
    -webkit-appearance: none; appearance: none;
  }
  input:focus { outline: none; border-color: #1a56a0; }

  .tipo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tipo-btn {
    padding: 12px 8px; border: 1.5px solid #ddd; border-radius: 10px;
    background: white; font-size: 13px; cursor: pointer;
    text-align: center; line-height: 1.5; color: #1a1a1a;
    transition: all 0.15s; -webkit-tap-highlight-color: transparent;
  }
  .tipo-btn:active { transform: scale(0.97); }
  .tipo-btn.active-buy { background: #cfe2ff; border-color: #1a56a0; color: #1a3a6e; font-weight: 600; }
  .tipo-btn.active-loan { background: #fff3cd; border-color: #e6a817; color: #7d4e00; font-weight: 600; }

  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; margin-top: 3px; }
  .badge-buy { background: #cfe2ff; color: #1a3a6e; }
  .badge-loan { background: #fff3cd; color: #7d4e00; }

  .sku-wrap { position: relative; }
  .sku-dropdown {
    display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
    background: white; border: 1.5px solid #ddd; border-radius: 8px;
    max-height: 220px; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12); margin-top: 2px;
  }
  .sku-item { padding: 12px 14px; font-size: 14px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
  .sku-item:last-child { border: none; }
  .sku-item:active { background: #f0f4ff; }
  .sku-item.new-sku { color: #1a56a0; font-style: italic; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .btn-submit {
    width: 100%; height: 52px; background: #1a56a0; color: white;
    border: none; border-radius: 10px; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-top: 4px; letter-spacing: 0.3px;
    -webkit-tap-highlight-color: transparent; transition: background 0.15s;
  }
  .btn-submit:active { background: #0e3a73; transform: scale(0.98); }
  .btn-submit:disabled { background: #aaa; }

  .success-box {
    display: none; border-radius: 10px; padding: 14px;
    text-align: center; margin-top: 12px;
  }
  .success-buy { background: #cfe2ff; border: 1.5px solid #1a56a0; }
  .success-buy p { color: #1a3a6e; font-size: 15px; font-weight: 600; }
  .success-buy span { color: #1a56a0; font-size: 12px; display: block; margin-top: 4px; }
  .success-loan { background: #fff3cd; border: 1.5px solid #e6a817; }
  .success-loan p { color: #7d4e00; font-size: 15px; font-weight: 600; }
  .success-loan span { color: #a06000; font-size: 12px; display: block; margin-top: 4px; }

  .error-box {
    display: none; background: #fdecea; border: 1.5px solid #c62828;
    border-radius: 10px; padding: 12px; margin-top: 10px;
    font-size: 13px; color: #b71c1c;
  }

  .hist-card { display: none; }
  .hist-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 10px; border-radius: 8px; margin-bottom: 6px;
    font-size: 13px;
  }
  .hist-item.tipo-compra { background: #cfe2ff; color: #1a3a6e; }
  .hist-item.tipo-emprestimo { background: #fff3cd; color: #7d4e00; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
  .tag-md2 { background: #ede7f6; color: #4527a0; }
  .tag-zenx { background: #ffe0b2; color: #e65100; }

  .footer { text-align: center; font-size: 11px; color: #aaa; padding: 20px 0 30px; }

  .legenda { display: flex; gap: 10px; margin-bottom: 14px; }
  .legenda-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #555; }
  .legenda-cor { width: 16px; height: 16px; border-radius: 4px; }
</style>
</head>
<body>

<div class="header">
  <h1>📦 Transferência de Estoque</h1>
  <p>MD2 ↔ ZENX — Compras e Empréstimos</p>
</div>

<div class="container">

  <div class="legenda">
    <div class="legenda-item"><div class="legenda-cor" style="background:#cfe2ff;border:1px solid #1a56a0"></div> Compra</div>
    <div class="legenda-item"><div class="legenda-cor" style="background:#fff3cd;border:1px solid #e6a817"></div> Empréstimo</div>
  </div>

  <div class="card">
    <div class="card-title">Funcionário</div>
    <input type="text" id="funcionario" placeholder="Digite seu nome" />
  </div>

  <div class="card">
    <div class="card-title">Tipo de movimentação</div>
    <div class="tipo-grid">
      <button class="tipo-btn" id="btn1" onclick="setTipo('MD2','ZENX','compra')">
        MD2 ← ZENX<br><span class="badge badge-buy">Compra</span>
      </button>
      <button class="tipo-btn" id="btn2" onclick="setTipo('MD2','ZENX','emprestimo')">
        MD2 ← ZENX<br><span class="badge badge-loan">Empréstimo</span>
      </button>
      <button class="tipo-btn" id="btn3" onclick="setTipo('ZENX','MD2','compra')">
        ZENX ← MD2<br><span class="badge badge-buy">Compra</span>
      </button>
      <button class="tipo-btn" id="btn4" onclick="setTipo('ZENX','MD2','emprestimo')">
        ZENX ← MD2<br><span class="badge badge-loan">Empréstimo</span>
      </button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Produto e Quantidade</div>

    <label>SKU do produto</label>
    <div class="sku-wrap">
      <input type="text" id="skuInput" placeholder="Digite o SKU ou parte do nome..."
        autocomplete="off" oninput="filterSku()" onfocus="filterSku()" onblur="setTimeout(hideDrop,250)" />
      <div class="sku-dropdown" id="skuDrop"></div>
    </div>

    <div class="row2" style="margin-top:12px">
      <div>
        <label>Quantidade</label>
        <input type="number" id="qtd" min="1" value="1" inputmode="numeric" />
      </div>
      <div>
        <label>Observação</label>
        <input type="text" id="obs" placeholder="Opcional" />
      </div>
    </div>

    <button class="btn-submit" id="btnEnviar" onclick="enviar()">
      ✓ Registrar movimentação
    </button>
  </div>

  <div class="success-box" id="successBox">
    <p id="successTitle"></p>
    <span id="successDetail"></span>
  </div>
  <div class="error-box" id="errorBox"></div>

  <div class="card hist-card" id="histCard">
    <div class="card-title">Últimos registros desta sessão</div>
    <div id="histList"></div>
  </div>

  <div class="footer">MD2 ↔ ZENX · Sistema de Estoque</div>
</div>

let tipoSelecionado = null;
let hist = [];

function setTipo(de, para, tipo){
  tipoSelecionado = {de, para, tipo};
  ['btn1','btn2','btn3','btn4'].forEach(b => document.getElementById(b).className='tipo-btn');
  const map = {'MD2-ZENX-compra':'btn1','MD2-ZENX-emprestimo':'btn2','ZENX-MD2-compra':'btn3','ZENX-MD2-emprestimo':'btn4'};
  const btn = document.getElementById(map[`${de}-${para}-${tipo}`]);
  if(btn) btn.className = 'tipo-btn ' + (tipo==='compra'?'active-buy':'active-loan');
}

function filterSku(){
  const q = document.getElementById('skuInput').value.trim().toUpperCase();
  const drop = document.getElementById('skuDrop');
  if(!q){ drop.style.display='none'; return; }
  const matches = SKUS.filter(s => s.toUpperCase().includes(q)).slice(0,12);
  const exact = SKUS.some(s => s.toUpperCase()===q);
  let html = matches.map(s => `<div class="sku-item" ontouchstart="" onclick="selectSku(this.dataset.v)" data-v="${s}">${s}</div>`).join('');
  if(!exact && q.length>1){
    const raw = document.getElementById('skuInput').value.trim();
    html += `<div class="sku-item new-sku" ontouchstart="" onclick="selectSku(this.dataset.v)" data-v="${raw}">+ Adicionar novo: "${raw}"</div>`;
  }
  drop.innerHTML = html;
  drop.style.display = (matches.length || (!exact && q.length>1)) ? 'block' : 'none';
}

function selectSku(s){
  document.getElementById('skuInput').value = s;
  document.getElementById('skuDrop').style.display = 'none';
}
function hideDrop(){ document.getElementById('skuDrop').style.display = 'none'; }

function enviar(){
  const func = document.getElementById('funcionario').value.trim();
  const sku  = document.getElementById('skuInput').value.trim();
  const qtd  = parseInt(document.getElementById('qtd').value)||0;
  const obs  = document.getElementById('obs').value.trim();
  const err  = document.getElementById('errorBox');
  err.style.display = 'none';

  if(!func){ err.textContent='⚠ Informe o nome do funcionário.'; err.style.display='block'; return; }
  if(!tipoSelecionado){ err.textContent='⚠ Selecione o tipo de movimentação.'; err.style.display='block'; return; }
  if(!sku){ err.textContent='⚠ Informe o SKU do produto.'; err.style.display='block'; return; }
  if(qtd<1){ err.textContent='⚠ Quantidade deve ser pelo menos 1.'; err.style.display='block'; return; }

  const btn = document.getElementById('btnEnviar');
  btn.disabled = true;
  btn.textContent = '⏳ Enviando...';

  const now = new Date();
  const d = now.toLocaleDateString('pt-BR');
  const h = now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

  const params = new URLSearchParams({
    data: d, hora: h, funcionario: func,
    empresa_origem: tipoSelecionado.para,
    empresa_destino: tipoSelecionado.de,
    tipo: tipoSelecionado.tipo,
    sku: sku, quantidade: qtd, observacao: obs
  });

  const img = new Image();
  img.src = SHEET_URL + '?' + params.toString();

  const payload = { data:d, hora:h, funcionario:func, empresa_origem:tipoSelecionado.para, empresa_destino:tipoSelecionado.de, tipo:tipoSelecionado.tipo, sku, quantidade:qtd };
  hist.unshift(payload);
  if(hist.length>5) hist.pop();

  setTimeout(()=>{
    const sBox = document.getElementById('successBox');
    const isCompra = tipoSelecionado.tipo === 'compra';
    sBox.className = 'success-box ' + (isCompra ? 'success-buy' : 'success-loan');
    sBox.style.display = 'block';
    document.getElementById('successTitle').textContent = isCompra ? '🔵 Compra registrada!' : '🟡 Empréstimo registrado!';
    document.getElementById('successDetail').textContent =
      `${tipoSelecionado.de} ← ${tipoSelecionado.para} | ${sku} | ${qtd}x | ${d} ${h}`;
    setTimeout(()=> sBox.style.display='none', 5000);
    document.getElementById('skuInput').value = '';
    document.getElementById('qtd').value = '1';
    document.getElementById('obs').value = '';
    btn.disabled = false;
    btn.textContent = '✓ Registrar movimentação';
    renderHist();
  }, 1500);
}

function renderHist(){
  if(!hist.length) return;
  document.getElementById('histCard').style.display = 'block';
  document.getElementById('histList').innerHTML = hist.map(h=>`
    <div class="hist-item tipo-${h.tipo}">
      <span>
        <span class="tag ${h.empresa_destino==='MD2'?'tag-md2':'tag-zenx'}">${h.empresa_destino}</span>
        ← <span class="tag ${h.empresa_origem==='ZENX'?'tag-zenx':'tag-md2'}">${h.empresa_origem}</span>
        &nbsp;${h.sku}
      </span>
      <span>${h.quantidade}x · ${h.tipo==='compra'?'🔵':'🟡'}</span>
    </div>`).join('');
}
